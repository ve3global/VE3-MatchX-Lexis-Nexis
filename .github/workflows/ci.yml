name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: EPIC-8 doc-parity check (no DB required — see tests/integration/doc-parity.test.ts)
        run: npx vitest run tests/integration/doc-parity.test.ts
