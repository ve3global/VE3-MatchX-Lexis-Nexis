sonar.projectKey=VE3-MatchX-Lexis-Nexis
sonar.projectName=VE3-MatchX-Lexis-Nexis
sonar.projectVersion=1.0

sonar.sources=src

# Transactional email templates. HTML email requires layout tables, the `width`
# attribute and inline styles for Outlook compatibility, so Sonar's web-page
# accessibility rules (S1827, S5256, S5257, S6819, S5254, S7924) do not apply.
sonar.exclusions=src/resources/**

sonar.sourceEncoding=UTF-8