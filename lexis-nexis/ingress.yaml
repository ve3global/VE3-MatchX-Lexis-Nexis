apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matchx-lexis-nexis-ingress
  namespace: deploy
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  tls:
    - hosts:
        - dev.matchx.blue
      secretName: matchx-blue-tls-secret

  rules:
    - host: dev.matchx.blue
      http:
        paths:
          - path: /lexis-nexis/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: matchx-lexis-nexis-service
                port:
                  number: 80