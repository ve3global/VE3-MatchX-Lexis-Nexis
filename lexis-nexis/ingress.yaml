apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matchx-lexis-nexis-ingress
  namespace: deploy
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
    - hosts:
        - dev.matchx.blue
      secretName: matchx-blue-tls-secret

  rules:
    - host: dev.matchx.blue
      http:
        paths:
          # No rewrite-target: the app itself mounts every route under
          # `/lexis-nexis` (see src/lib/apiPrefix.ts) and expects to see
          # that prefix on the incoming request. A rewrite-target here
          # strips it before forwarding, so the app 404s on every real
          # request — only a client that (wrongly) doubled the prefix
          # happened to land on a path the app recognized.
          - path: /lexis-nexis
            pathType: Prefix
            backend:
              service:
                name: matchx-lexis-nexis-service
                port:
                  number: 80